<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>JunkRaft 试玩版</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1424; }
    body { display: flex; justify-content: center; height: 100vh; height: 100dvh; }
    iframe { display: block; border: 0; width: 100%; height: 100%;
             max-width: calc(100vh * 9 / 16); max-width: calc(100dvh * 9 / 16); }
  </style>
</head>
<body>
  <iframe id="game" src="game.html" title="JunkRaft 试玩版" allow="autoplay; fullscreen"></iframe>
  <script>
    // 键盘事件只进有焦点的 iframe，点到框外也把焦点交回游戏
    var f = document.getElementById('game');
    function focusGame() { try { f.contentWindow.focus(); } catch (e) {} }
    f.addEventListener('load', focusGame);
    document.addEventListener('mousedown', focusGame);
  </script>
</body>
</html>
